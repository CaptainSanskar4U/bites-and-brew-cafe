<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Bites and Brew — animated gold banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231A14"/>
      <stop offset="1" stop-color="#0D0A08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9E7D23"/>
      <stop offset="0.35" stop-color="#F0D38D"/>
      <stop offset="0.6" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9E7D23"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF6D8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="titleClip">
      <text x="640" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="10">BITES &amp; BREW</text>
    </clipPath>
    <style>
      .tw { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.9; } }

      .title { animation: breathe 3.4s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.93; } }

      .glitch-a { animation: glitchA 5.5s steps(1) infinite; }
      @keyframes glitchA {
        0%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
        91% { opacity: 0.85; transform: translate(-5px, -2px); }
        92.5% { opacity: 0; }
        95% { opacity: 0.6; transform: translate(4px, 2px); }
        96.5% { opacity: 0; }
      }
      .glitch-b { animation: glitchB 5.5s steps(1) infinite; animation-delay: 0.35s; }
      @keyframes glitchB {
        0%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
        91% { opacity: 0.75; transform: translate(5px, 2px); }
        92.5% { opacity: 0; }
        95% { opacity: 0.55; transform: translate(-4px, -2px); }
        96.5% { opacity: 0; }
      }

      .shimmer { animation: sweep 5.2s ease-in-out infinite; }
      @keyframes sweep {
        0% { transform: translateX(0); }
        58% { transform: translateX(1580px); }
        100% { transform: translateX(1580px); }
      }

      .r1 { animation: ripple 4.6s ease-out infinite; }
      .r2 { animation: ripple 4.6s ease-out infinite 1.5s; }
      .r3 { animation: ripple 4.6s ease-out infinite 3s; }
      @keyframes ripple {
        0% { transform: scale(0.55); stroke-opacity: 0.6; }
        100% { transform: scale(1.8); stroke-opacity: 0; }
      }

      .w-1 { animation: driftL 16s linear infinite; }
      .w-2 { animation: driftR 11s linear infinite; }
      .w-3 { animation: driftL 7.5s linear infinite; }
      @keyframes driftL { from { transform: translateX(0); } to { transform: translateX(-320px); } }
      @keyframes driftR { from { transform: translateX(-320px); } to { transform: translateX(0); } }

      .bob > g { animation: bob 4.2s ease-in-out infinite alternate; }
      @keyframes bob {
        from { transform: translate(0, 0) rotate(-14deg); }
        to { transform: translate(0, 14px) rotate(10deg); }
      }

      .subtitle { animation: sub 6.5s ease-in-out infinite; }
      @keyframes sub { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <ellipse cx="640" cy="140" rx="430" ry="125" fill="url(#halo)"/>

  <g fill="#F0D38D">
    <circle class="tw" cx="96" cy="64" r="2.4"/>
    <circle class="tw" cx="238" cy="128" r="1.6" style="animation-delay:.7s"/>
    <circle class="tw" cx="1122" cy="58" r="2.2" style="animation-delay:1.1s"/>
    <circle class="tw" cx="1046" cy="176" r="1.6" style="animation-delay:1.9s"/>
    <circle class="tw" cx="180" cy="214" r="1.8" style="animation-delay:2.4s"/>
    <circle class="tw" cx="1188" cy="118" r="2.6" style="animation-delay:.4s"/>
  </g>

  <g transform="translate(640, 140)">
    <circle class="r1" r="150" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle class="r2" r="150" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
    <circle class="r3" r="150" fill="none" stroke="#F0D38D" stroke-width="1"/>
  </g>

  <g class="bob" transform="translate(168, 96)">
    <g>
      <ellipse rx="9" ry="13" fill="#6B4A2B"/>
      <path d="M0,-11 C4.5,-4 4.5,4 0,11" stroke="#3B2A18" stroke-width="2" fill="none"/>
    </g>
  </g>
  <g class="bob" transform="translate(1118, 186)">
    <g style="animation-delay:1.6s">
      <ellipse rx="8" ry="11" fill="#7A5632"/>
      <path d="M0,-9.5 C4,-3.5 4,3.5 0,9.5" stroke="#3B2A18" stroke-width="1.8" fill="none"/>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="10" text-anchor="middle">
    <text class="glitch-a" x="640" y="152" fill="#8E2328">BITES &amp; BREW</text>
    <text class="glitch-b" x="640" y="152" fill="#F0D38D">BITES &amp; BREW</text>
    <text class="title" x="640" y="152" fill="url(#gold)">BITES &amp; BREW</text>
  </g>
  <rect class="shimmer" x="-320" y="64" width="210" height="150" fill="url(#shine)" clip-path="url(#titleClip)"/>

  <text class="subtitle" x="640" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="6" fill="#F0D38D">THE FUSION CAFÉ • CBD BELAPUR • NAVI MUMBAI</text>

  <g class="w-1">
    <path d="M -320 240 q 80 -28 160 0 q 80 28 160 0 q 80 -28 160 0 q 80 28 160 0 q 80 -28 160 0 q 80 28 160 0 q 80 -28 160 0 q 80 28 160 0 q 80 -28 160 0 q 80 28 160 0 q 80 -28 160 0 q 80 28 160 0 L 1600 300 L -320 300 Z" fill="#D4AF37" opacity="0.10"/>
  </g>
  <g class="w-2">
    <path d="M -320 258 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 L 1600 300 L -320 300 Z" fill="#F0D38D" opacity="0.07"/>
  </g>
  <g class="w-3">
    <path d="M -320 274 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 L 1600 300 L -320 300 Z" fill="#8E2328" opacity="0.14"/>
  </g>
</svg>
