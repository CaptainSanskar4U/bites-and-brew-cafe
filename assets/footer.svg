<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-label="Brewed with GSAP — animated footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#110E0B"/>
      <stop offset="1" stop-color="#0A0806"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <style>
      .w-1 { animation: driftL 18s linear infinite; }
      .w-2 { animation: driftR 12s linear infinite; }
      @keyframes driftL { from { transform: translateX(0); } to { transform: translateX(-320px); } }
      @keyframes driftR { from { transform: translateX(-320px); } to { transform: translateX(0); } }
      .beat { animation: beat 2.2s ease-in-out infinite; }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        22% { transform: scale(1.28); }
        38% { transform: scale(0.94); }
        55% { transform: scale(1.16); }
        70% { transform: scale(1); }
      }
      .steam path { animation: rise 3.4s ease-out infinite; }
      .steam path:nth-child(2) { animation-delay: 1.1s; }
      .steam path:nth-child(3) { animation-delay: 2.2s; }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0; }
        25% { opacity: 0.8; }
        100% { transform: translateY(-26px); opacity: 0; }
      }
      .ftext { animation: ftext 5.5s ease-in-out infinite; }
      @keyframes ftext { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="170" fill="url(#fbg)"/>

  <g class="w-1">
    <path d="M -320 34 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 q 80 -22 160 0 q 80 22 160 0 L 1600 0 L -320 0 Z" fill="#1B1512"/>
  </g>
  <g class="w-2">
    <path d="M -320 20 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 q 80 18 160 0 q 80 -18 160 0 L 1600 0 L -320 0 Z" fill="#231A14" opacity="0.85"/>
  </g>

  <g class="steam" transform="translate(640, 74)" stroke="#F0D38D" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M -44 0 c 7 -9 -7 -17 0 -26"/>
    <path d="M 0 -2 c 7 -9 -7 -17 0 -26"/>
    <path d="M 44 -1 c 7 -9 -7 -17 0 -26"/>
  </g>

  <g transform="translate(640, 96)">
    <g class="beat">
      <path d="M0 13 C -8 6 -14 1 -14 -4 C -14 -8.5 -10.5 -11.5 -6.5 -11.5 C -3.7 -11.5 -1.4 -9.6 0 -7 C 1.4 -9.6 3.7 -11.5 6.5 -11.5 C 10.5 -11.5 14 -8.5 14 -4 C 14 1 8 6 0 13 Z" fill="#D4AF37" opacity="0.9"/>
    </g>
  </g>

  <text class="ftext" x="640" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#F0D38D">BREWED WITH GSAP • SERVED WITH LOVE</text>

  <rect x="240" y="158" width="800" height="1.6" fill="url(#fline)"/>
</svg>
