<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="Animated gold divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF6D8" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .shine { animation: travel 3.6s ease-in-out infinite; }
      @keyframes travel {
        0% { transform: translateX(-220px); }
        70% { transform: translateX(1080px); }
        100% { transform: translateX(1080px); }
      }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { transform: scale(0.82) rotate(45deg); opacity: 0.75; }
        50% { transform: scale(1.18) rotate(45deg); opacity: 1; }
      }
      .tw { animation: tw 3.2s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="70" y="21" width="1060" height="1.6" fill="url(#line)"/>
  <rect class="shine" x="0" y="20.3" width="200" height="3" fill="url(#spark)"/>

  <circle class="tw" cx="70" cy="22" r="3.2" fill="#D4AF37"/>
  <circle class="tw" cx="1130" cy="22" r="3.2" fill="#D4AF37" style="animation-delay:1.4s"/>

  <g transform="translate(600, 22)">
    <rect class="pulse" x="-6.5" y="-6.5" width="13" height="13" fill="#F0D38D"/>
  </g>
  <g transform="translate(600, 22)">
    <rect x="-9.5" y="-9.5" width="19" height="19" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5" transform="rotate(45)"/>
  </g>
</svg>
